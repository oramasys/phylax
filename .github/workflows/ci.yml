name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test with coverage
        run: python -m pytest
      - name: Compile smoke
        run: python -m compileall -q src/phylax

  # Cross-repository evidence that the issuer here and the Oramasys consumer still interoperate
  # with real Ed25519ph signatures. The Oramasys commit lives in exactly one place,
  # src/tests/interop/oramasys-permit-pin.txt; bump it whenever the consumer changes the permit
  # surface. Nothing here enables serving or promotes a production pin.
  permit-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Read the pinned Oramasys commit
        id: pin
        run: |
          PIN="$(tr -d '[:space:]' < src/tests/interop/oramasys-permit-pin.txt)"
          echo "$PIN" | grep -Eq '^[0-9a-f]{40}$'
          echo "commit=$PIN" >> "$GITHUB_OUTPUT"
      - name: Check out Oramasys at the pinned commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: oramasys/oramasys
          ref: ${{ steps.pin.outputs.commit }}
          path: oramasys-pinned
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install PyNaCl only
        run: python -m pip install 'PyNaCl>=1.5'
      - name: Probe copies must be byte-identical
        run: cmp src/tests/interop/c2_interop_probe.py oramasys-pinned/src/tests/interop/c2_interop_probe.py
      - name: Run the interop probe
        run: python src/tests/interop/c2_interop_probe.py "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/oramasys-pinned"
      - name: Run the slice 2 interop probe
        run: python src/tests/interop/c2_slice2_probe.py "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/oramasys-pinned"
